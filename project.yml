# xcodegen spec. edit this, then run `xcodegen` to regen GolfGame.xcodeproj
name: GolfGame
options:
  bundleIdPrefix: com.aidanbulovic
  deploymentTarget:
    iOS: "27.0"
    visionOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8B34YH66Q7  # personal team
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  SwingKit:
    path: Packages/SwingKit

targets:
  # vision pro app
  GolfGame:
    scheme: {}  # shared scheme so it survives regen
    type: application
    platform: visionOS
    sources: [Apps/VisionOS, Apps/Shared]
    dependencies:
      - package: SwingKit
    settings:
      base:
        PRODUCT_NAME: GolfGame
        PRODUCT_BUNDLE_IDENTIFIER: com.aidanbulovic.golfgame
    info:
      path: Apps/VisionOS/Info.plist
      properties:
        CFBundleDisplayName: Golf Game
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        NSLocalNetworkUsageDescription: Golf Game connects your iPhone and Vision Pro so your watch swings show up in the headset.
        NSBonjourServices: [_golfgame._tcp]
        NSHandsTrackingUsageDescription: Golf Game checks ur hands are together + in front of u at address. it never tracks the fast swing.

  # iphone relay app, embeds the watch app
  GolfGame iPhone:
    scheme: {}  # shared scheme so it survives regen
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared]
    dependencies:
      - package: SwingKit
      - target: GolfGame Watch
    settings:
      base:
        PRODUCT_NAME: GolfGamePhone
        PRODUCT_BUNDLE_IDENTIFIER: com.aidanbulovic.golfgame.phone
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO  # iphone only, no mac/avp compat builds
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: Golf Game
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Golf Game connects your iPhone and Vision Pro so your watch swings show up in the headset.
        NSBonjourServices: [_golfgame._tcp]

  # watch app, swing capture lives here later
  GolfGame Watch:
    scheme: {}  # shared scheme so it survives regen
    type: application
    platform: watchOS
    sources: [Apps/Watch]
    dependencies:
      - package: SwingKit
    settings:
      base:
        PRODUCT_NAME: GolfGameWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.aidanbulovic.golfgame.phone.watchkitapp
    entitlements:
      path: Apps/Watch/GolfGameWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: Golf Game
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.aidanbulovic.golfgame.phone
        WKBackgroundModes: [workout-processing]  # keeps app + fast sensors alive during session
        NSHealthShareUsageDescription: Golf Game doesnt read any health data.
        NSHealthUpdateUsageDescription: Golf Game runs a golf workout session so it can read your swing at high speed. nothing gets saved to Health.
        NSMotionUsageDescription: Golf Game uses motion sensors to measure your swing.
